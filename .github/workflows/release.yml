name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.0.0, v1.2.3, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  release:
    name: Create Release
    runs-on: macos-15  # Use macOS 15 (Sequoia) for best Apple Silicon support
    environment: Sonatype  # Access secrets from Sonatype environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Extract version from tag
        id: get_version
        run: |
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Sync version from tag into gradle.properties
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -i '' "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" gradle.properties
          echo "✅ gradle.properties updated to VERSION_NAME=${VERSION}"

      - name: Grant execute permission for scripts
        run: |
          chmod +x scripts/build/*.sh
          chmod +x scripts/release/*.sh

      - name: Build XCFramework
        run: ./scripts/build/build-xcframework.sh Release

      - name: Package XCFramework with checksum
        id: package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          cd build/xcframework
          zip -r "Spectra.xcframework.zip" "Spectra.xcframework"
          zip -r "SpectraLogger.xcframework.zip" "SpectraLogger.xcframework"
          zip -r "SpectraLoggerUI.xcframework.zip" "SpectraLoggerUI.xcframework"
          cd ../..

          UMBRELLA_CHECKSUM=$(swift package compute-checksum "build/xcframework/Spectra.xcframework.zip")
          CORE_CHECKSUM=$(swift package compute-checksum "build/xcframework/SpectraLogger.xcframework.zip")
          UI_CHECKSUM=$(swift package compute-checksum "build/xcframework/SpectraLoggerUI.xcframework.zip")

          echo "UMBRELLA_CHECKSUM=$UMBRELLA_CHECKSUM" >> $GITHUB_OUTPUT
          echo "CORE_CHECKSUM=$CORE_CHECKSUM" >> $GITHUB_OUTPUT
          echo "UI_CHECKSUM=$UI_CHECKSUM" >> $GITHUB_OUTPUT
          echo "CHECKSUM=$UMBRELLA_CHECKSUM" >> $GITHUB_OUTPUT
          echo "ZIP_PATH=build/xcframework/Spectra.xcframework.zip" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=Spectra.xcframework.zip" >> $GITHUB_OUTPUT

          echo "✅ Packages created"
          echo "🔐 Spectra Checksum: $UMBRELLA_CHECKSUM"
          echo "🔐 SpectraLogger Checksum: $CORE_CHECKSUM"
          echo "🔐 SpectraLoggerUI Checksum: $UI_CHECKSUM"

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHECKSUM="${{ steps.package.outputs.CHECKSUM }}"
          ZIP_NAME="${{ steps.package.outputs.ZIP_NAME }}"

          cat > release-notes.md << 'EOFNOTES'
          # SpectraLogger vVERSION_PLACEHOLDER 🚀

          **Production-ready lightweight logging framework for iOS and Android**

          ## 📦 What's Included

          ### Core Framework (SpectraLogger)
          - ⚡ **Ultra-fast logging**: < 0.1ms capture time (99th percentile < 1ms)
          - 🌐 **Network interception**: Automatic HTTP/HTTPS request/response logging
          - 💾 **Smart storage**: Circular buffer with automatic pruning (< 50MB for 10K+ logs)
          - 🔒 **Thread-safe**: Optimized for multi-threaded mobile apps
          - 📱 **Cross-platform**: iOS 13.0+ and Android 7.0+ (API 24+)
          - 🪶 **Lightweight**: Only 8.5MB

          ### iOS UI Companion (SpectraLoggerUI)
          - 🎨 **Native SwiftUI**: Beautiful, native iOS interface
          - 📊 **Real-time streaming**: Smooth 60 FPS log scrolling
          - 🔍 **Advanced filtering**: Multi-level filters, search, time ranges
          - 🌐 **Network inspector**: JSON syntax highlighting, cURL export
          - 📤 **Export**: JSON, Text, CSV formats with AirDrop support

          ---

          ## 📥 Installation

          ### Swift Package Manager (Recommended)

          Add to your Xcode project:
          ```
          https://github.com/REPO_PLACEHOLDER.git
          ```

          Or in `Package.swift`:
          ```swift
          dependencies: [
              .package(url: "https://github.com/REPO_PLACEHOLDER.git", from: "VERSION_PLACEHOLDER")
          ]
          ```

          ### CocoaPods

          Add to your `Podfile`:
          ```ruby
          pod 'SpectraLogger', '~> VERSION_PLACEHOLDER'           # Core logging
          pod 'SpectraLoggerUI', '~> VERSION_PLACEHOLDER'         # Optional: SwiftUI UI
          ```

          Then run:
          ```bash
          pod install
          ```

          ### Carthage

          Add to your `Cartfile`:
          ```ruby
          binary "https://raw.githubusercontent.com/REPO_PLACEHOLDER/main/SpectraLogger.json" ~> VERSION_PLACEHOLDER
          ```

          Then run:
          ```bash
          carthage update --use-xcframeworks --platform iOS
          ```

          ---

          ## 🚀 Quick Start

          ### Initialize Logger
          ```swift
          import SpectraLogger

          // In AppDelegate or App struct
          SpectraLogger.configure(
              maxInMemoryLogs: 1000,
              enableFileLogging: true,
              enableNetworkLogging: true
          )
          ```

          ### Log Messages
          ```swift
          let logger = SpectraLogger.getLogger(category: "MyFeature")

          logger.info("User logged in")
          logger.debug("Processing data...")
          logger.error("Operation failed", error: error)
          ```

          ### Show UI (iOS with SpectraLoggerUI)
          ```swift
          import SwiftUI
          import SpectraLoggerUI

          struct ContentView: View {
              @State private var showLogs = false

              var body: some View {
                  Button("Show Logs") {
                      showLogs = true
                  }
                  .sheet(isPresented: $showLogs) {
                      SpectraLoggerView()
                  }
              }
          }
          ```

          ---

          ## 📊 Technical Specifications

          | Component | Size | Platforms | Language |
          |-----------|------|-----------|----------|
          | **SpectraLogger** | 8.5MB | iOS 13.0+, Android 7.0+ | Kotlin Multiplatform |
          | **SpectraLoggerUI** | Source | iOS 15.0+ | Swift/SwiftUI |

          ### Binary Target Information (for manual SPM setup)

          ```swift
          .binaryTarget(
              name: "SpectraLogger",
              url: "https://github.com/REPO_PLACEHOLDER/releases/download/vVERSION_PLACEHOLDER/ZIP_NAME_PLACEHOLDER",
              checksum: "CHECKSUM_PLACEHOLDER"
          )
          ```

          **SHA256 Checksum:** `CHECKSUM_PLACEHOLDER`

          ### License
          Apache 2.0 (commercial-friendly)

          ---

          ## 📚 Documentation

          - [Installation Guide](https://github.com/REPO_PLACEHOLDER/blob/main/docs/INSTALLATION.md)
          - [CocoaPods Guide](https://github.com/REPO_PLACEHOLDER/blob/main/docs/COCOAPODS_GUIDE.md)
          - [Carthage Guide](https://github.com/REPO_PLACEHOLDER/blob/main/docs/CARTHAGE_GUIDE.md)
          - [SPM Distribution](https://github.com/REPO_PLACEHOLDER/blob/main/docs/SPM_DISTRIBUTION_GUIDE.md)
          - [Architecture Overview](https://github.com/REPO_PLACEHOLDER/blob/main/ARCHITECTURE.md)

          ---

          **Happy logging! 📝**
          EOFNOTES

          # Replace placeholders
          sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/g" release-notes.md
          sed -i '' "s/CHECKSUM_PLACEHOLDER/$CHECKSUM/g" release-notes.md
          sed -i '' "s/ZIP_NAME_PLACEHOLDER/$ZIP_NAME/g" release-notes.md
          sed -i '' "s|REPO_PLACEHOLDER|${{ github.repository }}|g" release-notes.md

          echo "RELEASE_NOTES_PATH=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/xcframework/Spectra.xcframework.zip
            build/xcframework/SpectraLogger.xcframework.zip
            build/xcframework/SpectraLoggerUI.xcframework.zip
          body_path: ${{ steps.release_notes.outputs.RELEASE_NOTES_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print release summary
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          UMBRELLA_CHECKSUM="${{ steps.package.outputs.UMBRELLA_CHECKSUM }}"
          CORE_CHECKSUM="${{ steps.package.outputs.CORE_CHECKSUM }}"
          UI_CHECKSUM="${{ steps.package.outputs.UI_CHECKSUM }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Release created successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Version: $VERSION"
          echo "🔐 Spectra Checksum: $UMBRELLA_CHECKSUM"
          echo "🔐 SpectraLogger Checksum: $CORE_CHECKSUM"
          echo "🔐 SpectraLoggerUI Checksum: $UI_CHECKSUM"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Update Package.swift with new checksum
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          UMBRELLA_CHECKSUM="${{ steps.package.outputs.UMBRELLA_CHECKSUM }}"
          CORE_CHECKSUM="${{ steps.package.outputs.CORE_CHECKSUM }}"
          UI_CHECKSUM="${{ steps.package.outputs.UI_CHECKSUM }}"

          # Update Umbrella target
          perl -i -pe "s|name: \"Spectra\",\s*url: \"https://github.com/snooky23/spectra/releases/download/v.*/Spectra.xcframework.zip\",\s*checksum: \".*\"|name: \"Spectra\", url: \"https://github.com/snooky23/spectra/releases/download/v${VERSION}/Spectra.xcframework.zip\", checksum: \"${UMBRELLA_CHECKSUM}\"|g" Package.swift

          # Update Core target
          perl -i -pe "s|name: \"SpectraLogger\",\s*url: \"https://github.com/snooky23/spectra/releases/download/v.*/SpectraLogger.xcframework.zip\",\s*checksum: \".*\"|name: \"SpectraLogger\", url: \"https://github.com/snooky23/spectra/releases/download/v${VERSION}/SpectraLogger.xcframework.zip\", checksum: \"${CORE_CHECKSUM}\"|g" Package.swift

          # Update UI target
          perl -i -pe "s|name: \"SpectraLoggerUI\",\s*url: \"https://github.com/snooky23/spectra/releases/download/v.*/SpectraLoggerUI.xcframework.zip\",\s*checksum: \".*\"|name: \"SpectraLoggerUI\", url: \"https://github.com/snooky23/spectra/releases/download/v${VERSION}/SpectraLoggerUI.xcframework.zip\", checksum: \"${UI_CHECKSUM}\"|g" Package.swift

          echo "✅ Package.swift updated with release checksums"

      - name: Update README.md with new version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Update Android implementation() version
          sed -i '' "s|io.github.snooky23:spectra-core:[0-9.]*\"|io.github.snooky23:spectra-core:${VERSION}\"|g" README.md
          sed -i '' "s|io.github.snooky23:spectra-ui-android:[0-9.]*\"|io.github.snooky23:spectra-ui-android:${VERSION}\"|g" README.md

          # Update iOS SPM from: version
          sed -i '' "s|from: \"[0-9.]*\"|from: \"${VERSION}\"|g" README.md

          echo "✅ README.md updated to v${VERSION}"

      - name: Commit and push Package.swift
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          git config user.name "Avi Levin"
          git config user.email "aviavi23@gmail.com"
          git add Package.swift gradle.properties README.md
          git diff --staged --quiet || git commit -m "chore: update Package.swift, README and version for v${VERSION} [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to CocoaPods (skipped - podspec files not set up yet)
      # To enable: create spectra-core/SpectraLogger.podspec and spectra-ui-ios/SpectraLoggerUI.podspec
      # - name: Publish to CocoaPods Trunk
      #   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
      #   run: |
      #     echo "CocoaPods publishing disabled - podspec files not configured"

      # Publish to Maven Central (Android only - iOS uses XCFramework via SPM)
      - name: Publish to Maven Central
        run: ./gradlew :spectra-core:publishAllPublicationsToMavenCentralRepository :spectra-ui:publishAllPublicationsToMavenCentralRepository :spectra-umbrella:publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

