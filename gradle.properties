# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37,37.0

# Gradle
# Sized to 4GB to prevent OOM killer on GitHub Actions 7GB runners
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djdk.lang.Process.launchMechanism=vfork
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Project
GROUP=io.github.snooky23
VERSION_NAME=1.0.4
POM_DESCRIPTION=A Kotlin Multiplatform logging framework for mobile applications
POM_URL=https://github.com/snooky23/spectra
POM_SCM_URL=https://github.com/snooky23/spectra
POM_SCM_CONNECTION=scm:git:git://github.com/snooky23/spectra.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/snooky23/spectra.git
POM_LICENCE_NAME=Apache License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=snooky23
POM_DEVELOPER_NAME=Avi Levin

# Swift Export
kotlin.swift-export.enabled=false
kotlin.js.yarn = false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin Native
kotlin.wasm.runViaBuildToolsApi=true
kotlin.js.runViaBuildToolsApi=true
kotlin.metadata.runViaBuildToolsApi=true
